name = "openbio-admin"
main = "src/index.ts"
compatibility_date = "2026-06-01"

# Non-secret config. Secrets (ADMIN_USERS, SESSION_SECRET, GITHUB_TOKEN,
# POSTHOG_READ_KEY) are set via `wrangler secret put` / GitHub Actions / .dev.vars
# — never commit real values. See secrets.local.example.
[vars]
GITHUB_REPO = "your-org/openbio"
GITHUB_BRANCH = "master"
POSTHOG_HOST = "https://eu.posthog.com"
POSTHOG_PROJECT_ID = ""
ALLOWED_ORIGIN = "https://openbio.page"

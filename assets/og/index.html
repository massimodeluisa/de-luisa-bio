<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200" />
    <title>Open Bio Page · OG image</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #F6F6F4;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .frame {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #F6F6F4;
        color: #14151B;
      }
      .mosaic {
        position: absolute;
        left: 0;
        top: 50%;
        width: 1200px;
        display: grid;
        grid-template-columns: repeat(8, minmax(0, 1fr));
        gap: 4px;
        background: #14151B;
        transform: translateY(-50%);
      }
      .mosaic img {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 5;
        object-fit: cover;
        object-position: 50% 30%;
      }
      .stage-copy {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        z-index: 2;
        width: 640px;
        padding: 52px;
        background: #F6F6F4;
        border: 1px solid rgba(20, 21, 27, 0.08);
        border-radius: 32px;
        box-shadow: 0 18px 48px rgba(20, 21, 27, 0.28);
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 22px;
        color: #3A5BFF;
        font-size: 15px;
        font-weight: 650;
        letter-spacing: 1.8px;
      }
      .eyebrow img { width: 28px; height: 28px; }
      h1 {
        margin-bottom: 24px;
        font-size: 76px;
        font-weight: 500;
        letter-spacing: -2.4px;
        line-height: 0.95;
      }
      .lead {
        color: rgba(20, 21, 27, 0.62);
        font-size: 26px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="mosaic"></div>
      <div class="stage-copy">
        <p class="eyebrow"><img class="mark" alt="" width="28" height="28" />100% FREE AND OPEN SOURCE</p>
        <h1>Open Bio Page.</h1>
        <p class="lead">Your links. Your brand. Your host. Your stats.<br>One page per person, on your own domain.</p>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

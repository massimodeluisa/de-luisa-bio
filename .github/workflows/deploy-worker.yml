name: Deploy admin worker

on:
  push:
    branches: [master]
    paths:
      - 'worker/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - run: bun install --frozen-lockfile

      # Wrangler resolves the project root from the repo's lockfile, so the
      # config is referenced from the root and framework autoconfig is disabled.
      - name: Push secrets and deploy
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          POSTHOG_READ_KEY: ${{ secrets.POSTHOG_READ_KEY }}
          ADMIN_USERS: ${{ secrets.ADMIN_USERS }}
        run: |
          CFG="--config worker/wrangler.toml"
          printf '%s' "$SESSION_SECRET"     | bunx wrangler secret put SESSION_SECRET    $CFG
          printf '%s' "$ADMIN_GITHUB_TOKEN" | bunx wrangler secret put GITHUB_TOKEN       $CFG
          printf '%s' "$POSTHOG_READ_KEY"   | bunx wrangler secret put POSTHOG_READ_KEY   $CFG
          printf '%s' "$ADMIN_USERS"        | bunx wrangler secret put ADMIN_USERS        $CFG
          bunx wrangler deploy --x-autoconfig=false $CFG

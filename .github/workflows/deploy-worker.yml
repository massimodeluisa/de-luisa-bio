name: Deploy admin worker

on:
  push:
    branches: [master]
    paths:
      - 'worker/**'
  workflow_dispatch:

jobs:
  deploy:
    if: github.repository != 'open-bio-page/open-bio-page'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Deploy and push secrets
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          POSTHOG_READ_KEY: ${{ secrets.POSTHOG_READ_KEY }}
          ADMIN_USERS: ${{ secrets.ADMIN_USERS }}
        run: |
          CFG="--config worker/wrangler.toml"
          bunx wrangler deploy $CFG
          put_secret() {
            if [ -z "$2" ]; then
              echo "skip $1 (unset on this repo)"
              return 0
            fi
            printf '%s' "$2" | bunx wrangler secret put "$1" $CFG
          }
          put_secret SESSION_SECRET "$SESSION_SECRET"
          put_secret GITHUB_TOKEN "$ADMIN_GITHUB_TOKEN"
          put_secret POSTHOG_READ_KEY "$POSTHOG_READ_KEY"
          put_secret ADMIN_USERS "$ADMIN_USERS"
